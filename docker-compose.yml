# Local/dev orchestration. In real production, run these behind your own
# reverse proxy / TLS termination and a real secret manager for the .env files.
services:
  inference:
    build: ./inference
    env_file: ./inference/.env
    environment:
      MODEL_DIR: /models
    volumes:
      - ./ml/artifacts:/models:ro   # model is mounted read-only, never baked into the image
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # No "ports:" — deliberately unreachable from outside this compose network.

  server:
    build: ./server
    env_file: ./server/.env
    environment:
      INFERENCE_URL: http://inference:8000
    ports:
      - "127.0.0.1:3000:3000"   # bind to localhost only; put a real reverse proxy in front for internet exposure
    depends_on:
      inference:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge 